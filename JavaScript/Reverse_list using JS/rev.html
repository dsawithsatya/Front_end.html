<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Reverse</title>
  </head>
  <body>
    <h1>Reverse of an array</h1>
    <script type="text/javascript">
      document.write("This is the original Array")
      for( var i=1;i<=5;i++){
        document.write("<hr>")

        document.write(i)
      }
      document.write("<h1>After the reverse operation</h1>")

    </script>
    <script src="rev.js"></script>

  </body>
</html>
