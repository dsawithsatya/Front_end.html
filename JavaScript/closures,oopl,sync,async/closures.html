<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closures_Inner functions</title>
</head>
<body>
    <fieldset>
        <legend style="font-weight: bold;">Closures_In_JS</legend>
        <h1 style="text-align: center;">THis is closures (Inner functions/Nested functions)</h1>

    </fieldset>
    <script>
        function x(){
            document.write("THis is outer function in JS")
            document.write("<br>")
            function y(){
                document.write("This is the inner function in JS")
            }
            y()
        }
        x()
    </script>
    
</body>
</html>
