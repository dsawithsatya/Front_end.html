<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess_number</title>
</head>
<body>
    <script>
        var x=4
        var y=Number(prompt("Enter your guess : "))
        if(x==y){
            alert("You guess the correct value it is : "+x)
        }
        else if(y>x){
            alert("You enter the greater number")
        }
        else if(y<x){
            alert("You entered the lesser number")
        }
    </script>
    
</body>
</html>
