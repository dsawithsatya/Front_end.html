<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Reverse</title>
  </head>
  <body>
    <h1>Original list of elements </h1>
    <script type="text/javascript">
      document.write("Before the operations all elements")
      var y=[20,10,40,90,30,50]
      var x=y[0]
      for( var i=0;i<=y.length-1;i++){
        document.write("<hr>")
        document.write(y[i])
        if (y[i]>x){
            x=y[i]
        }
      }
      document.write("<br>")
      document.write("<br>")
      document.write("<h1>The highest number in the list is <h1>")
      document.write("<hr>")
      document.write(x)
        
      

    </script>

  </body>
</html>
