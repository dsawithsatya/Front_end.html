
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator</title>
  <style>
    #a{
      background-color: black;
      height: 500px;
      width: 400px;
      margin-left: 500px;
      margin-top:100px;
      border-radius: 40px;
      padding-top: 20px;

    }
    button{
      height: 50px;
      width: 50px;
      border-radius: 25px;
      background-color: grey;
      margin-left: 30px;
        margin-top:30px;
        cursor: pointer;


    }
    #b{
        box-sizing: border-box;
        height: 75px;
        width: 350px;
        background-color: white;
        margin-left: 25px;
        border-radius: 20px;
        color: black;
        text-align: center;
        padding-top: 17px;
        font-size: 40px;
    
       
    }
    .line{
        margin-left: 20px;
    }
    
  </style>
</head>
<body>
  <div id="a">
     <div id="b"></div>
    
    <div class="line" >
   
    <button id="ac">AC</button>
    <button>DEL</button>
    <button>%</button>
    <button>/</button>
    </div>
    <div class="line" >
      <button id="7" >7</button>
      <button id="8" >8</button>
    <button id="9" >9</button>
    <button>*</button>

    </div>
    <div class="line">
      <button id="4"  >4</button>
    <button id="5">5</button>
    <button id="6">6</button>
    <button>-</button>

    </div>
    <div class="line">
      <button id="1">1</button>
    <button id="2">2</button>
    <button id="3">3</button>
    <button id="+">+</button>
    </div>
    <div class="line">
      <button id="0">0</button>
    <button>.</button>
    <button id="=">=</button>

    </div>


  </div>
  
  <script>  
document.getElementById('ac').addEventListener('click',function(){
    document.getElementById('b').innerHTML=""
})
document.getElementById('7').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="7"
})
document.getElementById('8').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="8"
})
document.getElementById('9').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="9"
})
document.getElementById('4').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="4"
})
document.getElementById('3').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="3"
})
document.getElementById('5').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="5"
})
document.getElementById('2').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="2"
})
document.getElementById('1').addEventListener('click',function(){
    document.getElementById('b').innerHTML+=1
})

document.getElementById('0').addEventListener('click',function(){
    document.getElementById('b').innerHTML+="0"
})
document.getElementById('6').addEventListener('click',function(){
    document.getElementById('b').innerHTML+=6
})
document.getElementById('+').addEventListener('click',function(){
    document.getElementById('b').innerHTML+='+'
})
document.getElementById("=").onclick=()=>{
    document.getElementById("=").innerHTML=eval(display.getElementById("=").innerHTML)
}


  </script>
</body>
</html>
