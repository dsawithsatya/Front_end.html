<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration_Page</title>
    <link rel="icon" href="https://t4.ftcdn.net/jpg/03/52/99/21/360_F_352992191_RRDlsq7U4N0qBZztiI5ehJtIjjHRvIxC.jpg">
</head>
<body>
    <form action="">

    <center>
    <label for="">Registration_Page</label>
    <fieldset>
        First_name:<input type="text" placeholder="First_name" title="Please enter the First_name" required pattern="[A-Z]{1}[a-z]*">
        <br>
        <br>
        Last_name:<input type="text" placeholder="Last_name" required pattern="[A-Z]{1}[a-z]*">
        <br>
        <br>
        <label for="">Email</label>
        <input type="text" placeholder="Email" required pattern="[a-z]*[@]{1}[gmail.com]{1}"> 
        <br>
        <br>
        Password:<input type="text" placeholder="Password" required pattern="[A-Z]{1}[a-z]*[!-@-#-$-%-^-&-*]{1}[0-9]*" value="Please enter for ex:">
        <br>
        <br>
        Re-enter Password:<input type="text" placeholder="Re-enter Password" required>
        <br>
        <br>
        <input type="submit" value="SUBMIT">
    </fieldset>
    </center>
    </form>

    
</body>
</html>
