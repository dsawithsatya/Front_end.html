<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control_statements</title>
</head>
<body>
    <h1><center>Control_statements in JS </center></h1>
    <hr>
    <script>
        var x=[12,3,4,7,1,2]
        document.write("<hr>")
        document.write("<br>")
        
        for (i in x){
            if(x[i]%2==0){
                document.write("The even elements are "+x[i])
                document.write("<br>")
            }
            else{
                document.write("These are not an even number "+x[i])
                document.write("<br>")
            }
        }
        var x=[24,23,22,21,8]
        document.write("<hr>")
        document.write("<br>")
        for (var i=0;i<x.length;i++){
            if(x[i]%2==0){
                document.write("The even elements are "+x[i])
                document.write("<br>")
            }
            else{
                document.write("These are not an even numbers"+x[i])
                document.write("<br>")
            }
        }
        var x=[5,6,8,6,3,0,3]
        document.write("<hr>")
        document.write("<br>")
        
        for (i of x){
            if(i%2==0){
                document.write("The even elements are "+i)
                document.write("<br>")
            }
            else{
                document.write("These are not an even "+i)
                document.write("<br>")
            }
        }

    </script>
    
</body>
</html>
