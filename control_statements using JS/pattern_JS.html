<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern_printing</title>
</head>
<body>
    <h1><center>Print the pattern using JS </center></h1>
    <script>
        x1=[1,2,3,4,5,6,7,8]
        y1=0
        for(i=0;i<=4;i++){
            if(x1[i]%2==0){
                continue
            }
                document.write(x1[i])
                document.write("<br>")
            }
        while(y1<=x1.length){
            if(x1[y1]%2==0){
                continue
            }
            document.write(x1[y1])
            document.write("<br>")
        }
        
    </script>

</body>
</html>
