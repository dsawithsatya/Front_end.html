<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age_Calculator</title>
</head>
<body>
    <h1>This is the age calculator we are performing</h1>
    <br>
    <hr>
    <script>
        var x=prompt("Enter your name : ")
        var y=prompt("Enter your age : ")
        ageindays=y*365.25
        remaindays=(100-y)*365.25
        alert("Hello,"+x+"\n Your age in days is :"+ageindays+"\n You have remaining days is :"+remaindays+"\n You have some days in earth so try to enjoy and keep smile ")
    </script>
    <hr>
</body>
</html>
