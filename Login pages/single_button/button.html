<div id="a" >
    <div class="head">
    
    </div>
    <div class="bodies">
       
    </div>
</div>

<style>
    .head{
        height: 60px;
        width: 60px;
        background-color: red   ;
        border-radius: 15px;
        margin-left: 20px;
        animation: vijay 5s infinite;
        animation-delay: 5s;

    }
    @keyframes vijay{
        0%{background-color: red;} 100%{background-color: blue;}
    }
    .bodies{
        height: 170px;
        width: 100px;
        background-color: red;
        border-radius: 10px;
        animation: vijay1 5s infinite;
        animation-delay: 5s;
    }
    @keyframes vijay1{
        0%{background-color: red;} 100%{background-color: blue;}
    }
    #a{
        animation: satya 10s infinite,alternate;
        animation-delay: 5s;
        
    }
   
    @keyframes satya{
        0%{margin-top: 0px;margin-left: 0px;} 60%{margin-top: 400px;margin-left: 300px;} 90%{margin-top:0px;margin-left: 600px;}
    }
</style>
